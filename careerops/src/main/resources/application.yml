spring:
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/careerops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:root}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}

server:
  port: ${SERVER_PORT:${PORT:8080}}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:careerops-default-dev-secret-change-in-production-must-be-long-enough}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  fit:
    skill-weight: ${FIT_SKILL_WEIGHT:40}
    responsibility-weight: ${FIT_RESPONSIBILITY_WEIGHT:25}
    experience-weight: ${FIT_EXPERIENCE_WEIGHT:20}
    resume-weight: ${FIT_RESUME_WEIGHT:15}

ai:
  enabled: ${AI_ENABLED:true}
  base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gemini-3.8-flash}

jobs:
  sources:
    mock:
      enabled: ${JOBS_MOCK_ENABLED:true}
    remote:
      enabled: ${JOBS_REMOTE_ENABLED:false}
      base-url: ${JOBS_REMOTE_BASE_URL:}
      api-key: ${JOB_API_KEY:${JOBS_REMOTE_API_KEY:}}

logging:
  level:
    com.careerops: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
